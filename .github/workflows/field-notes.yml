name: Field-note native amd64 validation

on:
  push:
    branches: [main, notebook-launchers]
    paths: ['field-notes/**', '.binder/**', '.github/workflows/field-notes.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify architecture and locked inputs
        run: |
          test "$(uname -m)" = x86_64
          python3 field-notes/verify_inputs.py
          sha256sum field-notes/tests/fixtures/environment.ipynb
      - name: Build core and neuro profiles (no registry publication)
        run: |
          docker build --platform linux/amd64 -f field-notes/core/Containerfile -t logben-field-notes-core:local field-notes
          cat field-notes/core/Containerfile field-notes/neuro/Containerfile | docker build --platform linux/amd64 -f - -t logben-field-notes-neuro:local field-notes
          docker image inspect --format '{{.Id}} {{.Architecture}} {{.Size}}' logben-field-notes-core:local logben-field-notes-neuro:local
      - name: Check core kernel offline
        run: |
          docker run --rm --platform linux/amd64 --network none --memory 2g \
            --mount type=bind,source="$PWD/field-notes",target=/checks,readonly \
            logben-field-notes-core:local python /checks/tests/test_runtime.py
      - name: Execute complete neuro suite offline
        run: |
          docker run --rm --platform linux/amd64 --network none --memory 2g \
            --mount type=bind,source="$PWD/field-notes",target=/checks,readonly \
            -e FIELD_NOTEBOOK=/checks/tests/fixtures/environment.ipynb \
            logben-field-notes-neuro:local python -m unittest discover -s /checks/tests -v
      - name: Build and verify the Binder adapter
        run: |
          docker build --platform linux/amd64 -f .binder/Dockerfile -t logben-binder:check .
          docker run --rm --network none --workdir /home/jovyan/notes logben-binder:check sha256sum -c SHA256SUMS
          docker run --rm --network none --memory 2g \
            --mount type=bind,source="$PWD/field-notes",target=/checks,readonly \
            -e FIELD_NOTEBOOK=/home/jovyan/notes/python-fsl-environment/environment.ipynb \
            logben-binder:check python -m unittest discover -s /checks/tests -v
          docker run --rm --network none logben-binder:check python -c 'import nbformat; from nbclient import NotebookClient; from pathlib import Path; p=Path("notes/hello/hello.ipynb"); assert p.stat().st_uid==1000; n=NotebookClient(nbformat.read(p,as_version=4),kernel_name="field-notes",timeout=30).execute(); assert "Hello, world!" in "".join(o.get("text","") for c in n.cells if c.cell_type=="code" for o in c.outputs)'
