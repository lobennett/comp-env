name: Field-note native amd64 validation

on:
  push:
    branches: [field-note-environments]
    paths: ['field-notes/**', '.github/workflows/field-notes.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify architecture and locked inputs
        run: |
          test "$(uname -m)" = x86_64
          python3 field-notes/verify_inputs.py
          sha256sum field-notes/tests/fixtures/environment.ipynb
      - name: Build core and neuro profiles (no registry publication)
        run: |
          docker build --platform linux/amd64 -f field-notes/core/Containerfile -t logben-field-notes-core:local field-notes
          cat field-notes/core/Containerfile field-notes/neuro/Containerfile | docker build --platform linux/amd64 -f - -t logben-field-notes-neuro:local field-notes
          docker image inspect --format '{{.Id}} {{.Architecture}} {{.Size}}' logben-field-notes-core:local logben-field-notes-neuro:local
      - name: Check core kernel offline
        run: |
          docker run --rm --platform linux/amd64 --network none --memory 2g \
            --mount type=bind,source="$PWD/field-notes",target=/checks,readonly \
            logben-field-notes-core:local python /checks/tests/test_runtime.py
      - name: Execute complete neuro suite offline
        run: |
          docker run --rm --platform linux/amd64 --network none --memory 2g \
            --mount type=bind,source="$PWD/field-notes",target=/checks,readonly \
            -e FIELD_NOTEBOOK=/checks/tests/fixtures/environment.ipynb \
            logben-field-notes-neuro:local python -m unittest discover -s /checks/tests -v
